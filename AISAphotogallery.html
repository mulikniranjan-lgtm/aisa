<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AISA Photo Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #91cfdf;
      text-align: center;
    }

    h1 {
      background: #333;
      color: white;
      padding: 15px;
      margin: 0;
    }

    .events {
      margin: 20px;
    }

    .events button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      background: #fc4664;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    .events button:hover {
      background: #d63a55;
    }

 .gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 30px;
}


    .gallery img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 12px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
}
.gallery img:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}
  </style>
</head>

<body>

<h1>AISA Photo Gallery</h1>

<div class="events">
  <button onclick="loadEvent('freshers')">Freshers</button>
  <button onclick="loadEvent('event2')">Spektrum</button>
  <button onclick="loadEvent('event3')">Event 3</button>
</div>
<div class="gallery" id="gallery"></div>

<script>
  const eventPhotos = {
   freshers: [
  "images/Freshers/f1.jpeg"
],
    event2: [
      "images/event2/photo1.jpg",
      "images/event2/photo2.jpg",
      "images/event2/photo3.jpg"
    ],
    event3: [
      "images/event3/photo1.jpg",
      "images/event3/photo2.jpg",
      "images/event3/photo3.jpg"
    ]
  };

  function loadEvent(eventName) {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    eventPhotos[eventName].forEach(photo => {
      const img = document.createElement("img");
      img.src = photo;
      gallery.appendChild(img);
    });
  }
</script>

</body>
</html>
